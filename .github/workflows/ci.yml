name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # action 固定到 commit SHA：移动 tag（v5）在上游可被改写，而这个仓库的产物会被
      # 自动更新直接下载执行（2026-09-29 审查 P2，与 release.yml 同一口径）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # runner 镜像里没有 ffmpeg，而 GIF 帧条与语音转码的用例依赖它：缺了会被显式跳过，
      # 于是"CI 绿"覆盖不到这两条链路（2026-09-26 实测：新用例在缺 ffmpeg 时断言失败）。
      # 装发行版包（不引第三方 action），顺便多验证一个 ffmpeg 版本（生产是 4.4.2）。
      - name: 安装 ffmpeg（GIF 帧条 / 音频转码用例依赖）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1

      - name: 语法检查（src / scripts / test / ui，递归）
        run: |
          set -e
          # 先确认四个目录都在：find 对"某个目录不存在"只报错不改变退出码传递，
          # 少检一个目录会静默通过（2026-09-26 审查）。
          for d in src scripts test ui; do
            [ -d "$d" ] || { echo "缺少目录：$d"; exit 1; }
          done
          # 递归：src/ 按领域分了子目录，用 src/*.js 这种 glob 会静默漏掉子目录。
          # 用 mapfile 并断言非空：`for f in $(find ...)` 会吃掉 find 的退出码，find 失败时
          # 循环体一次都不跑，却照样打印"通过（0 个文件）"并成功退出。
          mapfile -t files < <(find src scripts test ui -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          [[ ${#files[@]} -gt 0 ]] || { echo "没有找到任何待检查文件"; exit 1; }
          for f in "${files[@]}"; do node --check "$f"; done
          echo "语法检查通过（${#files[@]} 个文件）"

      - name: Shell 脚本语法检查
        run: |
          set -e
          # 全仓库的 .sh 都检：写死文件名时，新加的脚本不会被检查（2026-10-01 审查）。
          # bash -n 只处理第一个位置参数（其余会当成 $1/$2），所以逐个跑。
          mapfile -t shells < <(find . -maxdepth 2 -name '*.sh' -not -path './node_modules/*' | sort)
          [[ ${#shells[@]} -gt 0 ]] || { echo "没有找到任何 .sh"; exit 1; }
          for f in "${shells[@]}"; do bash -n "$f"; done
          echo "Shell 语法检查通过（${#shells[@]} 个）"

      - name: 未定义调用扫描（严格模式）
        run: node src/ops.js scan --strict

      - name: 单元测试
        run: npm run test:unit

      # 更新器的部署前门禁（scripts/auto-update.mjs）把同一份**门禁全清单**跑在 unit 的
      # 加固环境里（install-service.mjs 生成的 unit 带 NoNewPrivileges=true + UMask=0077）。
      # CI 默认环境没有这两样，于是一类"只在门禁环境里败"的用例（真实 /proc 探测、文件权限）
      # 能一路绿到把更新路径弄瘫 —— 2026-10-10 线上实测即是如此（#1043/#1048 两条 sudo 回退
      # 用例在带 NNP 的 unit 里必败，导致所有标准部署都装不上新版本）。这一步按 unit 的姿势
      # 把门禁清单（unit + local + 四个回归 harness + scan，与更新器同一份）复跑一遍。
      # 2026-10-10 同族第二个漏网：门禁单元的进程也可能没有 docker 组（用户管理器未继承），
      # 此时 ops-health 里断言"全绿"的用例会因直连真实套接字失败而全红（issue #30 实测恰好
      # 3 条必挂、门禁拒绝升级）—— 所以这里同时把 DOCKER_HOST 指向 000 权限的假套接字，
      # 把"套接字不可访问"也作为门禁环境的一个维度复跑。
      - name: 更新器门禁全清单（按 unit 的加固环境复跑：NoNewPrivileges + umask 0077 + 无 docker 访问）
        run: |
          command -v setpriv >/dev/null || { echo "缺少 setpriv"; exit 1; }
          umask 0077
          NO_DOCKER_SOCK="${RUNNER_TEMP:-/tmp}/no-docker-access.sock"
          : > "$NO_DOCKER_SOCK"
          chmod 000 "$NO_DOCKER_SOCK"
          export DOCKER_HOST="unix://$NO_DOCKER_SOCK"
          setpriv --no-new-privs npm run test:unit
          setpriv --no-new-privs npm run test:local
          setpriv --no-new-privs npm run test:regression
          setpriv --no-new-privs node src/ops.js scan --strict

      - name: 本地回归测试
        run: npm run test:local

      # 走 test:regression（scripts/test-suite.mjs）而不是裸 node：三条测试步骤统一由
      # runner 重定向 TMPDIR/TMP/TEMP 到本次运行专属根目录，跑完整体删除，避免用例往
      # /tmp 里堆 qq-* 垃圾（2026-10-09，测试卫生）。
      - name: 提示词 / 渲染 / 滚动 / 用量端到端回归
        run: npm run test:regression

  # ESLint 门禁（改进方案 C4）：与本地 `npm run lint` 同口径 —— 0 error 才能进 main。
  # 与 test 分开成 job：lint 失败时一眼看到是风格/静态问题，不用翻几百行测试输出。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: ESLint（0 error）
        run: npm run lint
